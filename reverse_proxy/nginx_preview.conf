# Added by AI Software Factory (2026-08-25) for LOCAL PREVIEW ONLY, via the
# existing reverse_proxy/Dockerfile `ARG NGINX_CONF` mechanism (same pattern
# already used by nginx_test.conf/nginx_staging.conf/nginx_campha.conf/
# nginx_caoson.conf — no existing file modified).
#
# Differs from nginx_test.conf in 2 ways, both required for this factory's
# preview convention (see deployment/preview/preview-docker-compose.yaml):
#   1. "listen 80" instead of "listen 8888" — the factory gateway
#      (gateway/nginx.conf) always proxies <slug>.preview.localhost:8080 to
#      http://<slug>-frontend:80 on the shared `factory-preview` network, so
#      this container must listen on 80 to be reachable at all.
#   2. NO "location ~ ^/(auth|.well-known|taisan) { proxy_pass kong_gateway }"
#      block — this preview does not join PORTAL-PM's Kong network, so a
#      Kong upstream would fail to resolve at nginx startup. Portal/SSO login
#      is intentionally OUT of scope for this preview (local login only) —
#      see docs/TECHNICAL_DEBT.md.
#
# Upstream names match deployment/preview/preview-docker-compose.yaml exactly
# (qlts_frontend / qlts_backend:8386, port from application.properties
# server.port which has no env override).

worker_processes auto;
events { worker_connections 1024; }
error_log /dev/stdout warn;

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream frontend {
        server qlts_frontend:80;
    }

    upstream backend {
        server qlts_backend:8386;
    }

    server {
        listen 80;
        client_max_body_size 20M;

        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /swagger-ui/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /v3/api-docs/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
